name: Daily Economy News Batch

on:
  schedule:
    # 매일 한국 시간(KST) 오전 11:00 실행 (UTC 기준 02:00)
    - cron: '0 2 * * *'
  workflow_dispatch: # GitHub 웹에서 [Run workflow] 버튼으로 수동 즉시 실행 가능

permissions:
  contents: write

jobs:
  build-and-generate:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 3.10 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 의존 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 경제 뉴스 AI 배치 생성 실행 (오늘/어제/일주일)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python batch_generate.py

      - name: 생성된 news_data.json 자동 커밋 & 푸시
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add news_data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: Daily economy news update [$(date +'%Y-%m-%d')]" && git push)

