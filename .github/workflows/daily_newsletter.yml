name: Economy News AI Automated Batch

on:
  schedule:
    # 한국 시간(KST) 매일 06:10, 08:10, 10:10, 12:10, 14:10, 16:10, 18:10 (2시간 간격 총 7회)
    # UTC 기준 21:10, 23:10, 01:10, 03:10, 05:10, 07:10, 09:10
    # GitHub 무료 러너의 정각(:00) 대기열 병목을 피해 10분에 실행
    - cron: '10 21,23,1,3,5,7,9 * * *'
  workflow_dispatch: # GitHub 웹에서 [Run workflow] 버튼으로 수동 즉시 실행 가능

permissions:
  contents: write

jobs:
  build-and-generate:
    runs-on: ubuntu-latest
    env:
      TZ: "Asia/Seoul"

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 3.10 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 의존 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 경제 뉴스 AI 배치 생성 실행 (스마트 갱신)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python batch_generate.py

      - name: 생성된 news_data.json 자동 커밋 & 푸시
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add news_data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: Auto economy news update [$(date +'%Y-%m-%d %H:%M') KST]" && git push)

